; PlatformIO Project Configuration — Bottle Feed Logger
;
; Board: ESP32 DevKit V1 (38-pin)
; Framework: Arduino
;
; Serial port: not pinned here because the name is machine-specific (macOS
; /dev/cu.*, Linux /dev/tty*, Windows COM*) and hard-coding it breaks uploads
; for everyone else. If PlatformIO auto-selects the wrong port (on macOS it
; often grabs /dev/cu.Bluetooth-Incoming-Port, which gives null-byte garbage
; in the monitor), pin it locally in one of these ways:
;   1) one-off:   pio run -t upload --upload-port /dev/your-port
;                 pio device monitor --port /dev/your-port
;   2) per-shell: export PLATFORMIO_UPLOAD_PORT=/dev/your-port
;                 export PLATFORMIO_MONITOR_PORT=/dev/your-port
; Find your port with:  pio device list
;   macOS:   ls /dev/cu.*          (e.g. /dev/cu.usbserial-0001)
;   Linux:   ls /dev/ttyUSB* /dev/ttyACM*
;   Windows: pio device list       (e.g. COM3)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

; UniversalTelegramBot + TLS + HX711 + OLED fit the default partition,
; but huge_app gives breathing room.
board_build.partitions = huge_app.csv

lib_deps =
    bogde/HX711@^0.7.5
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.10
    bblanchon/ArduinoJson@^7.0.4
    ; Optional — only needed if you enable Telegram confirmation:
    witnessmenow/UniversalTelegramBot@^1.3.0

build_flags =
    -DCORE_DEBUG_LEVEL=2
